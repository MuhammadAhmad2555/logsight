<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#10131E">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LogSight: collect, search and explore logs from all your apps.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="trackapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LogSight</title>
  <link rel="manifest" href="manifest.json">

  <!-- Open connections early: Flutter's engine and fonts, then Firebase. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>

  <style>
    html, body { width: 100%; height: 100%; margin: 0; }
    html { background: #10131E; }
    body { overflow: hidden; background: transparent; }
    /* Shown until Flutter draws its first frame. */
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease;
    }
    #loader div {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(124, 131, 253, .25); border-top-color: #7C83FD;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // Safari paints the areas around the page (status bar, address bar, the
    // overscroll edges) from theme-color and the page background. Keep both in
    // step with the app's *chosen* theme, not the phone's system setting.
    // Flutter calls window.setBrowserChrome(isDark) whenever the theme changes.
    (function () {
      var colors = { dark: '#10131E', light: '#F5F6FA' };
      function apply(dark) {
        var c = dark ? colors.dark : colors.light;
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', c);
        var root = document.documentElement;
        root.style.backgroundColor = c;
        root.style.colorScheme = dark ? 'dark' : 'light';
      }
      window.setBrowserChrome = apply;

      // First paint, before Flutter loads: use the saved choice
      // (shared_preferences stores it in localStorage as "flutter.theme_mode").
      var mode = 'system';
      try {
        var raw = localStorage.getItem('flutter.theme_mode');
        if (raw) mode = JSON.parse(raw);
      } catch (e) {}
      var systemDark = window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(mode === 'dark' || (mode !== 'light' && systemDark));
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="loader" aria-label="Loading"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (!l) return;
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
